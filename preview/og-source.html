<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
/* The share image: 1200 x 630 on deep green. Rendered to og-image.png by
   preview/render-og.mjs; nothing here ships to a visitor. */
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#16261F;font-family:Inter,-apple-system,system-ui,sans-serif;color:#F4F2ED}
.canvas{position:relative;width:1200px;height:630px;display:flex;align-items:center;padding:0 0 0 76px}
h1{font-size:74px;line-height:1.02;letter-spacing:-0.03em;font-weight:800;margin:0;max-width:560px;color:#FFFFFF}
.word{position:absolute;left:76px;bottom:56px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:26px;color:#F4F2ED}
.word svg{width:34px;height:34px}
.phone{position:absolute;right:88px;top:52px;width:300px;height:620px;border-radius:44px;background:#0f1a14;border:9px solid #0a0e0c;padding:30px 16px;color:#fff;box-sizing:border-box}
.clock{text-align:center;margin:26px 0 30px}
.time{display:block;font-size:64px;font-weight:600;letter-spacing:-0.03em;line-height:1}
.date{display:block;font-size:14px;color:rgba(255,255,255,.72);margin-top:4px}
.n{background:rgba(255,255,255,.15);border-radius:16px;padding:12px 13px;display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.ic{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.14);flex:none;display:grid;place-items:center}
.ic svg{width:23px;height:23px}
.app{font-size:11px;font-weight:700;letter-spacing:.05em;color:rgba(255,255,255,.74);display:flex;justify-content:space-between}
.app span{font-weight:500;letter-spacing:0}
.hl{font-size:14.5px;font-weight:600;line-height:1.3;margin-top:3px}
</style>
</head>
<body>
<div class="canvas">
  <h1>You get told. That&rsquo;s the whole point.</h1>
  <div class="word" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2.2 3.8 5.4v6c0 4.6 3.2 7.9 8.2 9.4 5-1.5 8.2-4.8 8.2-9.4v-6L12 2.2Z" fill="#348C52" stroke="#dcb978" stroke-width="1.2"/><path d="M8.2 12.1 10.8 14.7 15.8 9.5" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>Shieldora</div>
  <div class="phone" aria-hidden="true">
    <div class="clock"><span class="time">9:41</span><span class="date">Tuesday, 3 June</span></div>
    <div class="n"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2.6 4.6 5.3v6c0 4.3 3 7.4 7.4 8.8 4.4-1.4 7.4-4.5 7.4-8.8v-6L12 2.6Z" fill="#1c5334" stroke="#dcb978" stroke-width="1.2"/><path d="M8.4 12 10.9 14.6 15.8 9.3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span><span class="app">SHIELDORA<span>now</span></span><span class="hl">A site was blocked on Layla&rsquo;s iPhone</span></span></div>
    <div class="n"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2.6 4.6 5.3v6c0 4.3 3 7.4 7.4 8.8 4.4-1.4 7.4-4.5 7.4-8.8v-6L12 2.6Z" fill="#1c5334" stroke="#dcb978" stroke-width="1.2"/><path d="M8.4 12 10.9 14.6 15.8 9.3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span><span class="app">SHIELDORA<span>20m ago</span></span><span class="hl">Screen Time permission was restored on Layla&rsquo;s iPhone</span></span></div>
    <div class="n"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2.6 4.6 5.3v6c0 4.3 3 7.4 7.4 8.8 4.4-1.4 7.4-4.5 7.4-8.8v-6L12 2.6Z" fill="#1c5334" stroke="#dcb978" stroke-width="1.2"/><path d="M8.4 12 10.9 14.6 15.8 9.3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span><span class="app">SHIELDORA<span>30m ago</span></span><span class="hl">Protection was turned off on Layla&rsquo;s iPhone</span></span></div>
  </div>
</div>
</body>
</html>
